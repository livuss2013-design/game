<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <!-- Подключаем скрипт Telegram, чтобы приложение понимало, что оно внутри мессенджера -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Библиотека для праздничного конфетти при выигрыше -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        body { 
            text-align: center; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #1c2733; 
            color: white; 
            margin: 0;
            padding: 20px;
        }
        .container { 
            margin-top: 30px; 
            position: relative; 
            display: inline-block; 
        }
        /* Стрелочка, которая указывает на приз */
        .arrow { 
            position: absolute; 
            top: -20px; 
            left: 50%; 
            transform: translateX(-50%); 
            width: 0; 
            height: 0; 
            border-left: 15px solid transparent; 
            border-right: 15px solid transparent; 
            border-top: 30px solid #ff4136; 
            z-index: 10; 
        }
        #wheel { 
            width: 320px; 
            height: 320px; 
            border-radius: 50%; 
            border: 8px solid #ffffff; 
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            transition: transform 4s cubic-bezier(0.1, 0, 0.2, 1); 
        }
        button { 
            margin-top: 40px; 
            padding: 15px 40px; 
            font-size: 20px; 
            font-weight: bold;
            cursor: pointer; 
            background: #31b545; 
            color: white; 
            border: none; 
            border-radius: 12px;
            box-shadow: 0 4px #218c32;
        }
        button:active {
            box-shadow: 0 2px #218c32;
            transform: translateY(2px);
        }
        #result {
            margin-top: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #f1c40f;
        }
    </style>
</head>
<body>

    <h2>🎡 Испытай удачу!</h2>
    
    <div class="container">
        <div class="arrow"></div>
        <canvas id="wheel" width="300" height="300"></canvas>
    </div>

    <div id="result"></div>
    <button id="spinBtn" onclick="spin()">КРУТИТЬ!</button>

    <script>
        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const resultText = document.getElementById('result');
        const spinBtn = document.getElementById('spinBtn');

        // НАСТРОЙКА ТВОИХ ПРИЗОВ: Можешь менять текст здесь
        const sectors = ["Приз 1", "Пусто", "Приз 2", "Скидка 10%", "Приз 3", "Пусто"];
        const colors = ["#FF5733", "#34495e", "#3357FF", "#F1C40F", "#9B59B6", "#34495e"];

        function drawWheel() {
            const arc = (2 * Math.PI) / sectors.length;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.font = "bold 16px Arial";

            sectors.forEach((text, i) => {
                const angle = i * arc;
                ctx.beginPath();
                ctx.fillStyle = colors[i];
                ctx.moveTo(150, 150);
                ctx.arc(150, 150, 150, angle, angle + arc);
                ctx.fill();
                
                // Текст призов
                ctx.save();
                ctx.translate(150, 150);
                ctx.rotate(angle + arc / 2);
                ctx.fillStyle = "white";
                ctx.fillText(text, 100, 0);
                ctx.restore();
            });
        }

        let currentRotation = 0;
        let isSpinning = false;

        function spin() {
            if (isSpinning) return;
            isSpinning = true;
            spinBtn.disabled = true;
            resultText.innerText = "";

            // Генерируем случайное вращение (минимум 5 оборотов + случайный сектор)
            const randomExtra = Math.floor(Math.random() * 360);
            const totalSpin = 1800 + randomExtra; 
            currentRotation += totalSpin;

            canvas.style.transform = `rotate(${currentRotation}deg)`;
            
            // Ждем 4 секунды (время анимации), прежде чем показать результат
            setTimeout(() => {
                isSpinning = false;
                confetti(); // Запуск эффекта конфетти
                resultText.innerText = "Ура! Ты выиграл!";
                
                // Сообщаем Телеграму, что игра закончена (можно передать результат боту)
                // Telegram.WebApp.sendData("Выигрыш: " + randomExtra); 
            }, 4000);
        }

        drawWheel();
        // Сообщаем Телеграму, что приложение готово
        Telegram.WebApp.ready();
    </script>
</body>
</html>
