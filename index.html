<script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const sectors = ["Приз 1", "Пусто", "Приз 2", "Скидка 10%", "Приз 3", "Пусто"];
        let isSpinning = false;

        function spin() {
            if (isSpinning) return;
            isSpinning = true;
            
            const btn = document.getElementById('btn');
            btn.disabled = true;
            btn.style.opacity = "0.5";
            
            const wheel = document.getElementById('wheel');
            const randomIndex = Math.floor(Math.random() * sectors.length);
            
            // Крутим на 5 полных оборотов + нужный сектор
            const totalRotation = 1800 + (randomIndex * 60); 
            wheel.style.transform = `rotate(${totalRotation}deg)`;

            setTimeout(() => {
                const winner = sectors[sectors.length - 1 - randomIndex];
                // Сначала пробуем отправить данные
                try {
                    tg.sendData(winner);
                } catch (e) {
                    console.log("Ошибка отправки, но мы все равно закроем окно");
                }
                // Закрываем через секунду после остановки
                setTimeout(() => tg.close(), 1000);
            }, 4500);
        }
    </script>
