<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <!-- Подключаем скрипты Телеграма и салюта -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        body { 
            text-align: center; 
            font-family: sans-serif; 
            background: #1c2733; 
            color: white; 
            margin: 0; 
            overflow: hidden; 
            padding-top: 20px;
        }
        .container { 
            margin-top: 20px; 
            position: relative; 
            display: inline-block; 
        }
        .arrow { 
            position: absolute; 
            top: -15px; 
            left: 50%; 
            transform: translateX(-50%); 
            width: 0; 
            height: 0; 
            border-left: 12px solid transparent; 
            border-right: 12px solid transparent; 
            border-top: 25px solid #ff4136; 
            z-index: 10; 
        }
        #wheel { 
            width: 280px; 
            height: 280px; 
            border-radius: 50%; 
            border: 5px solid #fff; 
            transition: transform 4s cubic-bezier(0.1, 0, 0.2, 1); 
        }
        button { 
            margin-top: 30px; 
            padding: 15px 40px; 
            font-size: 20px; 
            background: #31b545; 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-weight: bold; 
            cursor: pointer; 
            box-shadow: 0 4px #218c32;
        }
        button:active { 
            box-shadow: 0 2px #218c32; 
            transform: translateY(2px); 
        }
    </style>
</head>
<body>
    <h2>🎡 Крути колесо!</h2>
    
    <div class="container">
        <div class="arrow"></div>
        <canvas id="wheel" width="300" height="300"></canvas>
    </div>
    
    <div id="result" style="margin-top:15px; font-size: 24px; font-weight: bold; color: #f1c40f;"></div>
    
    <button id="spinBtn" onclick="spin()">ИСПЫТАТЬ УДАЧУ</button>

    <script>
        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        
        // Названия призов
        const sectors = ["Приз 1", "Пусто", "Приз 2", "Скидка 10%", "Приз 3", "Пусто"];
        const colors = ["#FF5733", "#34495e", "#3357FF", "#F1C40F", "#9B59B6", "#34495e"];

        function draw() {
            const arc = (2 * Math.PI) / sectors.length;
            ctx.textAlign = "center"; 
            ctx.textBaseline = "middle"; 
            ctx.font = "bold 16px Arial";
            
            sectors.forEach((text, i) => {
                const angle = i * arc;
                ctx.beginPath(); 
                ctx.fillStyle = colors[i]; 
                ctx.moveTo(150, 150);
                ctx.arc(150, 150, 150, angle, angle + arc); 
                ctx.fill();
                
                ctx.save(); 
                ctx.translate(150, 150); 
                ctx.rotate(angle + arc / 2);
                ctx.fillStyle = "white"; 
                ctx.fillText(text, 100, 0); 
                ctx.restore();
            });
        }

        let rotation = 0;
        function spin() {
            // Крутим минимум на 5 полных оборотов (1800 градусов) + случайный кусок
            const extra = Math.floor(Math.random() * 360) + 1800;
            rotation += extra;
            canvas.style.transform = `rotate(${rotation}deg)`;
            
            // Отключаем кнопку, чтобы не нажали дважды
            document.getElementById('spinBtn').disabled = true;
            document.getElementById('result').innerText = "";
            
            // Ждем 4 секунды (пока крутится)
            setTimeout(() => { 
                confetti(); 
                document.getElementById('result').innerText = "Победа!";
            }, 4000);
        }
        
        draw();
        // Разворачиваем приложение на весь экран Телеграма
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
    </script>
</body>
</html>
